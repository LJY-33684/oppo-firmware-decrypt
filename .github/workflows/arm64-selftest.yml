name: ARM64 selftest

on:
  workflow_dispatch:
  push:
    paths:
      - 'oppo-firmware-decrypt/app/**'
      - 'oppo-firmware-decrypt/decrypt_cli.py'
      - 'oppo-firmware-decrypt/main.py'
      - '.github/workflows/arm64-selftest.yml'

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show ARM64 environment
        run: |
          uname -a
          python3 --version
          openssl version

      - name: Verify bundled ARM64 components
        working-directory: oppo-firmware-decrypt
        run: |
          chmod +x app/bin/linux/arm64/openssl app/bin/linux/arm64/brotli
          file app/bin/linux/arm64/openssl app/bin/linux/arm64/brotli
          ldd app/bin/linux/arm64/openssl
          ldd app/bin/linux/arm64/brotli
          app/bin/linux/arm64/openssl version
          app/bin/linux/arm64/brotli --version

      - name: Run OPPO selftest on ARM64
        working-directory: oppo-firmware-decrypt
        env:
          OPPO_SKIP_GUI: 1
        run: |
          python3 app/tests/selftest.py
